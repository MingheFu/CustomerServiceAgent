server:
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:h2:mem:agent_cs_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.agentcs.backend: INFO
    org.hibernate.SQL: WARN
